[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trapdoor"
version = "0.0.0"
description = "Trapdoor: Install-Time Behavior Auditor (observe installs, report behavior)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Trapdoor" }]

[project.scripts]
trapdoor = "trapdoor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
